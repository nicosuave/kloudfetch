name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Python tests
        run: |
          uv sync --extra test
          uv run pytest -q
      - name: Python lint
        run: uvx ruff check .
      - name: Compose validation
        run: docker compose config --quiet
      - name: Build Spark extension
        run: mvn -q -f spark-extension/pom.xml -DskipTests package
      - name: Compile JDBC harnesses
        run: mvn -q -f integration/jdbc/pom.xml compile

  integration:
    name: Spark ${{ matrix.spark }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - spark: 3.5.9
            scala: 2.12.18
            scala_binary: "2.12"
            hadoop_aws: 3.3.4
          - spark: 4.0.4
            scala: 2.13.16
            scala_binary: "2.13"
            hadoop_aws: 3.4.1
          - spark: 4.1.3
            scala: 2.13.17
            scala_binary: "2.13"
            hadoop_aws: 3.4.2
          - spark: 4.2.0
            scala: 2.13.18
            scala_binary: "2.13"
            hadoop_aws: 3.5.0
    env:
      SPARK_VERSION: ${{ matrix.spark }}
      SCALA_VERSION: ${{ matrix.scala }}
      SCALA_BINARY_VERSION: ${{ matrix.scala_binary }}
      HADOOP_AWS_VERSION: ${{ matrix.hadoop_aws }}
      DATABRICKS_JDBC_VERSIONS: >-
        3.0.1 3.0.3 3.0.4 3.0.5 3.0.6 3.0.7
        3.1.1 3.2.1
        3.3.1 3.3.3
        3.4.1 3.4.2
    steps:
      - uses: actions/checkout@v7
      - name: Run 12-driver integration sweep
        run: bash .github/scripts/integration-matrix.sh
